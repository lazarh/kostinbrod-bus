<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Костинброд — Автобуси на живо</title>
<meta name="description" content="Реално-времеви позиции на автобусите на Община Костинброд на OpenStreetMap карта." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
<header>
  <h1>Костинброд — Автобуси на живо</h1>
  <div class="meta">
    <span id="now"></span>
    <span id="liveStatus" class="badge">Свързване…</span>
  </div>
</header>

<div class="layout">
  <div id="map"></div>
  <aside>
    <section class="controls">
      <label>Линия:
        <select id="lineFilter"><option value="all">Всички линии</option></select>
      </label>
      <label><input type="checkbox" id="showVehicles" checked> Показвай автобусите</label>
    </section>

    <section>
      <h2>На път сега</h2>
      <ul id="activeList" class="list"></ul>
    </section>

    <section>
      <h2>Следващи тръгвания</h2>
      <ul id="upcomingList" class="list"></ul>
    </section>

    <section class="legend">
      <h2>Легенда</h2>
      <div id="legendItems"></div>
    </section>

    <section class="sources">
      <h2>Източник</h2>
      <ul>
        <li>Данни в реално време: <a href="https://live.transport.kostinbrod.bg" target="_blank">live.transport.kostinbrod.bg</a> (GPS, маршрути, разписания).</li>
        <li>Карта: © OpenStreetMap contributors.</li>
      </ul>
    </section>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js?v=4"></script>
</body>
</html>
